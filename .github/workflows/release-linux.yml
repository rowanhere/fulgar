name: release-linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native binary
        working-directory: native/brc-pow
        run: cargo build --locked --release

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: '12.5.0'
          method: network
          sub-packages: '["nvcc"]'

      - name: Build CUDA binary
        working-directory: native/brc-pow-cuda
        run: make

      - name: Package binary
        run: |
          mkdir -p dist
          cp native/brc-pow/target/release/brc-pow dist/brc-pow-linux-x86_64
          cp native/brc-pow-cuda/target/release/brc-pow-cuda dist/brc-pow-cuda-linux-x86_64
          tar -C dist -czf fulgurminer-linux-x86_64.tar.gz brc-pow-linux-x86_64
          tar -C dist -czf fulgurminer-cuda-linux-x86_64.tar.gz brc-pow-cuda-linux-x86_64

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fulgurminer-linux-x86_64.tar.gz
            fulgurminer-cuda-linux-x86_64.tar.gz
